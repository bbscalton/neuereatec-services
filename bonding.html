<script>if(matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelector('svg').pauseAnimations()</script><script>(function(){var g=document.getElementById('gauge'),t=document.getElementById('spd');if(matchMedia('(prefers-reduced-motion: reduce)').matches){g.setAttribute('stroke-dasharray','92 100');return}var s=performance.now();function f(n){var p=((n-s)%6000)/4000;if(p>1){t.textContent='~350–380';g.setAttribute('stroke-dasharray','92 100')}else{var e=1-Math.pow(1-p,3);t.textContent=Math.round(365*e);g.setAttribute('stroke-dasharray',(92*e)+' 100')}requestAnimationFrame(f)}requestAnimationFrame(f)})()</script></body></html>
