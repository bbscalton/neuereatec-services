<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local VLAN bonding test — Neuereatec</title><style>html,body{margin:0;background:#0e141b;color:#f4efe6;font-family:"Segoe UI",system-ui,sans-serif}body:before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 35% at 15% 10%,rgba(212,160,74,.22),transparent 70%),radial-gradient(35% 30% at 90% 20%,rgba(240,198,116,.14),transparent 70%)}

></text></g><g transform="translate(20 440)"><rect width="170" height="60" rx="16" fill="url(#card)" stroke="#fff" stroke-opacity=".12"/><rect x="20" y="14" width="18" height="30" rx="4" fill="none" stroke="url(#g)" stroke-width="3"/><rect x="25" y="20" width="8" height="10" rx="1" fill="url(#g)"/><text x="54" y="28" fill="#fff" font-size="14" font-weight="700">Cellular Modem</text><text x="54" y="45" fill="#9aa6b2" font-size="11">USB · <tspan fill="#f0c674" font-weight="700">40 Mbps</tspan></text></g><g class="dots"><circle r="4" fill="#f0c674"><animateMotion dur="2.4s" begin="-0.0s" repeatCount="indefinite" path="M190 70 L380 260"/></circle><circle r="4" fill="#f0c674"><animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite" path="M190 70 L380 260"/></circle><circle r="4" fill="#f0c674"><animateMotion dur="2.4s" begin="-0.2s" repeatCount="indefinite" path="M190 170 L380 260"/></circle><circle r="4" fill="#f0c674"><animateMotion dur="2.4s" begin="-1.4s" repeatCount="indefinite" path="M190 170 L380 260"/></circle><circle r="4" fill="#f0c674"><animateMotion dur="2.4s" begin="-0.4s" repeatCount="indefinite" path="M190 270 L380 260"/></circle><circle r="4" fill="#f0c674"><animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite" path="M190 270 L380 260"/></circle><circle r="4" fill="#f0c674"><animateMotion dur="2.4s" begin="-0.6s" repeatCount="indefinite" path="M190 370 L380 260"/></circle><circle r="4" fill="#f0c674"><animateMotion dur="2.4s" begin="-1.8s" repeatCount="indefinite" path="M190 370 L380 260"/></circle><circle r="4" fill="#f0c674"><animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite" path="M190 470 L380 260"/></circle><circle r="4" fill="#f0c674"><animateMotion dur="2.4s" begin="-2.0s" repeatCount="indefinite" path="M190 470 L380 260"/></circle><circle r="6" fill="#f0c674"><animateMotion dur="3s" begin="-0.0s" repeatCount="indefinite" path="M380 102 L380 198 L380 260 L540 260 L700 260 L805 260"/></circle><circle r="4.5" fill="#fff"><animateMotion dur="3s" begin="-0.37s" repeatCount="indefinite" path="M805 266 L700 266 L540 266 L388 266 L388 198 L388 102"/></circle><circle r="6" fill="#f0c674"><animateMotion dur="3s" begin="-0.75s" repeatCount="indefinite" path="M380 102 L380 198 L380 260 L540 260 L700 260 L805 260"/></circle><circle r="4.5" fill="#fff"><animateMotion dur="3s" begin="-1.12s" repeatCount="indefinite" path="M805 266 L700 266 L540 266 L388 266 L388 198 L388 102"/></circle><circle r="6" fill="#f0c674"><animateMotion dur="3s" begin="-1.5s" repeatCount="indefinite" path="M380 102 L380 198 L380 260 L540 260 L700 260 L805 260"/></circle><circle r="4.5" fill="#fff"><animateMotion dur="3s" begin="-1.87s" repeatCount="indefinite" path="M805 266 L700 266 L540 266 L388 266 L388 198 L388 102"/></circle><circle r="6" fill="#f0c674"><animateMotion dur="3s" begin="-2.25s" repeatCount="indefinite" path="M380 102 L380 198 L380 260 L540 260 L700 260 L805 260"/></circle><circle r="4.5" fill="#fff"><animateMotion dur="3s" begin="-2.62s" repeatCount="indefinite" path="M805 266 L700 266 L540 266 L388 266 L388 198 L388 102"/></circle></g></svg></div><p class="cap">Local VLAN test: five links, one combined speed test.</p><p style="color:#8a95a1;font-size:.82rem;max-width:720px;margin:6px auto 0">Illustration with example speeds. In a real local test, VLAN-to-VLAN traffic stays on the switch and does not cross the Starlink links; to measure bonded speed the test server must sit beyond the links.</p></main>
<script>if(matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelector('svg').pauseAnimations()</script><script>(function(){var g=document.getElementById('gauge'),t=document.getElementById('spd');if(matchMedia('(prefers-reduced-motion: reduce)').matches){g.setAttribute('stroke-dasharray','60 100');return}var s=performance.now();function f(n){var p=((n-s)%6000)/4000;if(p>1){t.textContent='~250';g.setAttribute('stroke-dasharray','60 100')}else{var e=1-Math.pow(1-p,3);t.textContent=Math.round(250*e);g.setAttribute('stroke-dasharray',(60*e)+' 100')}requestAnimationFrame(f)}requestAnimationFrame(f)})()</script></body></html>
